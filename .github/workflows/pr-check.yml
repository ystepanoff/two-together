name: PR Build Check

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '25'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Report success
      if: success()
      run: echo "✅ Build successful! PR is ready for review."

    - name: Report failure
      if: failure()
      run: echo "❌ Build failed! Please fix the errors before merging."
